<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT 시스템 구현 로직 설계 — 주니어 개발자 퀴즈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh;padding:2rem 1rem}
.app{max-width:680px;margin:0 auto}
.progress-bar-wrap{height:4px;background:#ddd;border-radius:2px;margin-bottom:1.5rem}
.progress-bar{height:4px;background:#003366;border-radius:2px;transition:width .4s ease}
.module-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.mod-btn{font-size:12px;padding:5px 13px;border:1px solid #ccc;border-radius:20px;background:#fff;color:#555;cursor:pointer;transition:all .15s;font-family:inherit}
.mod-btn:hover{border-color:#003366;color:#003366;background:#f0f4ff}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:14px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.screen{display:none}
.screen.active{display:block}
.tag{font-size:11px;font-weight:700;color:#888;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.4rem}
.q-number{font-size:13px;color:#999;margin-bottom:.6rem}
.q-text{font-size:15.5px;font-weight:500;color:#111;line-height:1.65;margin-bottom:1.2rem}
.q-code{font-family:'SF Mono','Fira Code','Consolas','Courier New',monospace;font-size:12.5px;background:#f6f8fa;border:1px solid #e0e0e0;border-radius:8px;padding:.75rem 1rem;margin-bottom:1.2rem;line-height:1.75;color:#24292e;white-space:pre-wrap;overflow-x:auto}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:1.2rem}
.choice{display:flex;align-items:flex-start;gap:10px;padding:.7rem .9rem;border:1px solid #e0e0e0;border-radius:9px;cursor:pointer;transition:all .15s;background:#fff;text-align:left;width:100%;font-family:inherit}
.choice:hover{border-color:#003366;background:#f0f4ff}
.choice.selected{border-color:#003366;background:#eef2ff}
.choice.correct{border-color:#2e7d32;background:#f0fff4}
.choice.wrong{border-color:#c62828;background:#fff5f5}
.choice-key{width:24px;height:24px;min-width:24px;border-radius:50%;background:#f2f2f2;border:1px solid #ddd;font-size:12px;font-weight:600;color:#555;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice.correct .choice-key{background:#e8f5e9;color:#2e7d32;border-color:#81c784}
.choice.wrong .choice-key{background:#ffebee;color:#c62828;border-color:#e57373}
.choice.selected .choice-key{background:#dbe4ff;color:#003366;border-color:#7b9fe0}
.choice-text{font-size:14px;color:#222;line-height:1.55}
.feedback{border-radius:9px;padding:.9rem 1rem;font-size:13.5px;line-height:1.65;margin-bottom:1rem;display:none}
.feedback.show{display:block}
.feedback.correct{background:#f0fff4;border:1px solid #81c784;color:#1b5e20}
.feedback.wrong{background:#fff5f5;border:1px solid #e57373;color:#b71c1c}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 20px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:500}
.btn:hover{background:#f5f5f5}
.btn:active{transform:scale(.98)}
.btn-primary{background:#003366;color:#fff;border-color:#003366}
.btn-primary:hover{background:#00408a;border-color:#00408a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.score-ring{width:88px;height:88px;margin:0 auto 1.2rem;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#111}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1rem 0 1.5rem}
.stat{background:#f7f7f7;border-radius:9px;padding:.85rem;text-align:center;border:1px solid #eee}
.stat-n{font-size:24px;font-weight:600}
.stat-l{font-size:12px;color:#888;margin-top:3px}
.review-item{border:1px solid #e0e0e0;border-radius:9px;padding:.875rem 1rem;margin-bottom:8px}
.review-item.r-correct{border-color:#a5d6a7}
.review-item.r-wrong{border-color:#ef9a9a}
.review-q{font-size:13px;font-weight:500;margin-bottom:5px;line-height:1.5}
.review-a{font-size:12px;color:#666;line-height:1.5}
.domain-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:#f0f4ff;color:#003366;font-weight:600;margin-bottom:.6rem;border:1px solid #c7d2fe}
.intro-hero{text-align:center;padding:1.5rem 1rem 1.2rem}
.intro-icon{width:68px;height:68px;background:#003366;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.intro-title{font-size:21px;font-weight:600;color:#111;margin-bottom:.5rem;line-height:1.3}
.intro-sub{font-size:14px;color:#666;line-height:1.7;margin-bottom:1.5rem}
.module-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.mod-card{display:flex;align-items:center;gap:12px;padding:.8rem 1rem;border:1px solid #e0e0e0;border-radius:9px;background:#fff;cursor:pointer;transition:all .15s}
.mod-card:hover{border-color:#003366;background:#f0f4ff;transform:translateX(2px)}
.mod-num{width:36px;height:36px;background:#003366;color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.mod-info{flex:1}
.mod-name{font-size:14px;font-weight:600;color:#111}
.mod-desc{font-size:12px;color:#888;margin-top:1px}
.mod-count{font-size:12px;color:#aaa;flex-shrink:0}
.divider{height:1px;background:#f0f0f0;margin:1.2rem 0}
.result-header{margin-bottom:1.5rem}
.result-msg{font-size:19px;font-weight:600;color:#111;margin-bottom:.3rem}
.result-sub-text{font-size:13px;color:#666}
.review-title{font-size:14px;font-weight:600;color:#333;margin-bottom:.9rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:12px;font-weight:500}
.chip-correct{background:#e8f5e9;color:#2e7d32}
.chip-wrong{background:#ffebee;color:#c62828}
</style>
</head>
<body>
<div class="app">
  <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="module-nav" id="module-nav" style="display:none"></div>

  <!-- ─── INTRO ─── -->
  <div class="screen active" id="screen-intro">
    <div class="card">
      <div class="intro-hero">
        <div class="intro-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.04Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.04Z"/></svg>
        </div>
        <div class="intro-title">"요구사항대로 만들었는데<br>왜 틀렸나요?"</div>
        <div class="intro-sub">주니어 개발자를 위한 로직 설계 함정 퀴즈<br>실제 사례 기반 문제 20선 — ERP · CRM · HR · MES</div>
        <button class="btn btn-primary" style="margin:0 auto" onclick="startAll()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          전체 풀기 (20문제)
        </button>
        <p style="font-size:12px;color:#bbb;margin-top:10px">또는 아래 모듈을 선택해 해당 파트만 풀 수 있습니다</p>
      </div>
      <div class="divider"></div>
      <div class="module-list" id="intro-module-list"></div>
    </div>
  </div>

  <!-- ─── QUIZ ─── -->
  <div class="screen" id="screen-quiz">
    <div class="card">
      <div class="domain-badge" id="q-domain"></div>
      <div class="tag" id="q-module-tag"></div>
      <div class="q-number" id="q-number"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-code" id="q-code" style="display:none"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-submit" onclick="submit()" disabled>확인</button>
        <button class="btn" id="btn-next" onclick="next()" style="display:none">
          다음 문제
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ─── RESULT ─── -->
  <div class="screen" id="screen-result">
    <div class="card" style="text-align:center;padding:2rem">
      <div class="score-ring">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="37" fill="none" stroke="#e8e8e8" stroke-width="8"/>
          <circle cx="44" cy="44" r="37" fill="none" stroke="#003366" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="232.5"
            id="score-arc" stroke-dashoffset="232.5" style="transition:stroke-dashoffset .8s ease"/>
        </svg>
        <div class="ring-text" id="score-pct"></div>
      </div>
      <div class="result-msg" id="result-title"></div>
      <div class="result-sub-text" id="result-sub"></div>
      <div class="stat-row">
        <div class="stat"><div class="stat-n" id="stat-correct" style="color:#2e7d32"></div><div class="stat-l">정답</div></div>
        <div class="stat"><div class="stat-n" id="stat-wrong" style="color:#c62828"></div><div class="stat-l">오답</div></div>
        <div class="stat"><div class="stat-n" id="stat-total"></div><div class="stat-l">총 문제</div></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="retryWrong()" id="btn-retry-wrong">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          오답만 다시 풀기
        </button>
        <button class="btn" onclick="goIntro()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          처음으로
        </button>
      </div>
    </div>
    <div class="card">
      <div class="review-title">문제별 결과 요약</div>
      <div id="review-list"></div>
    </div>
  </div>
</div>

<script>
const MODULES=[
  {id:'m0',num:'00',name:'오프닝 — 사고 패턴',desc:'주니어 vs. 시니어 사고 전환'},
  {id:'m1',num:'01',name:'데이터 모델링 함정',desc:'화면≠테이블, Effective Date, Status'},
  {id:'m2',num:'02',name:'프로세스 로직 함정',desc:'Edge Case, 동시성, UI 유효성'},
  {id:'m3',num:'03',name:'요구사항 해석 함정',desc:'5 Whys, 묵시적 룰, 과잉 투자'},
  {id:'m4',num:'04',name:'워크어라운드·기술 부채',desc:'플래그 남용, 하드코딩, 문서화'},
];

const Q=[
  {mod:'m0',domain:'사고 패턴',
   q:'고객이 "재고가 부족하면 자동으로 발주해 주세요"라고 요청했다. 주니어 개발자는 즉시 코드를 짜기 시작했다. 시니어 개발자가 먼저 해야 할 일은?',
   choices:['요청 그대로 재고 임계값 비교 로직을 구현한다','발주 승인 프로세스, 공급업체별 리드타임, 최대발주수량 등 묵시적 룰을 먼저 파악한다','자동 발주 기능이 기술적으로 가능한지 확인한다','고객에게 요구사항 명세서를 먼저 써달라고 요청한다'],
   answer:1,
   fb:'시니어는 "어떻게 구현할까"보다 "이 기능이 실제로 어떻게 동작해야 하는가"를 먼저 묻습니다. 발주는 승인, 한도, 공급업체 조건 등 수많은 묵시적 비즈니스 룰을 가지고 있습니다.'},
  {mod:'m0',domain:'사고 패턴',
   q:'주니어 개발자가 "기능 구현 완료"라고 보고했다. 시니어가 "이 데이터가 삭제되면 어떻게 되나요?"라고 물었더니 주니어가 당황했다. 이 상황이 보여주는 주니어의 사고 패턴 문제는?',
   choices:['코드 품질이 낮다','Happy Path만 구현하고 예외 케이스를 검토하지 않았다','테스트 코드를 작성하지 않았다','문서화를 소홀히 했다'],
   answer:1,
   fb:'주니어는 기능이 "정상적으로 동작하는 경우"만 구현하는 경향이 있습니다. 시니어는 항상 "이것이 실패하면?", "데이터가 없으면?", "동시에 접근하면?"을 먼저 생각합니다.'},
  {mod:'m0',domain:'사고 패턴',
   q:'새 기능 설계를 위임받은 주니어가 첫 번째 떠오른 방법으로 바로 구현을 시작했다. 시니어가 권장하는 "3-Option Rule"의 핵심 의미는?',
   choices:['기능을 3개 화면으로 나눠 구현하는 방법이다','구현 전 최소 3가지 방법을 나열하고 장단점을 비교한 후 선택해야 한다','3명의 개발자가 코드 리뷰를 한다','3번 테스트 후 배포한다'],
   answer:1,
   fb:'처음 떠오른 방법이 최선인 경우는 드뭅니다. 최소 3가지 방법을 나열하고 "왜 이 방법을 선택했는가"를 문서로 남기는 습관이 주니어와 시니어를 가르는 핵심 역량입니다.'},
  {mod:'m0',domain:'사고 패턴',
   q:'데이터 생명주기 설계에서 CRUDS의 "S(Archive)"를 설계 단계에서 반드시 고려해야 하는 이유는?',
   choices:['검색(Search) 기능 최적화를 위해','법적 보존 기간, 보관 후 조회 가능 여부 등을 초기 설계에 반영하지 않으면 나중에 전면 재설계가 필요하기 때문이다','동기화(Sync)를 위해','공유(Share) 기능 구현을 위해'],
   answer:1,
   fb:'데이터는 Create→Read→Update→Delete→Archive의 전체 생명주기를 가집니다. Archive 설계가 없으면 법적 보존 의무 위반, 불필요한 데이터 누적, 보관 데이터 조회 불가 문제가 발생합니다.'},
  {mod:'m1',domain:'ERP 구매·재고',
   q:'신입 개발자가 주문 화면의 필드를 그대로 DB 테이블로 만들었다. 아래 테이블 구조의 가장 큰 문제점은?',
   code:'orders (order_id, customer_name, item_name, qty, status, address)',
   choices:['컬럼 수가 너무 적다','품목이 여러 개인 주문을 저장할 수 없고, 주소 변경 이력을 추적할 수 없다','status 컬럼 타입이 잘못됐다','customer_name을 저장하면 안 된다'],
   answer:1,
   fb:'화면은 데이터를 "보여주는 방식"이고, 테이블은 데이터를 "생존시키는 구조"입니다. 품목이 여러 개이면 order_lines 테이블이 별도로 필요하고, 주소는 변경 이력을 위해 별도 테이블로 분리해야 합니다.'},
  {mod:'m1',domain:'ERP 회계·HR',
   q:'직원 급여 테이블을 아래와 같이 설계했다. 6개월 후 "작년 3월 기준 급여를 조회해 주세요"라는 요청이 왔을 때 발생하는 문제는?',
   code:'employees (emp_id, name, salary, department)',
   choices:['조회 쿼리를 작성하기 어렵다','salary 컬럼에 현재 값만 있어 과거 시점 급여를 조회할 방법이 없다','department 컬럼이 없어서 조직별 집계가 불가능하다','emp_id가 중복될 수 있다'],
   answer:1,
   fb:'Effective Date 패턴이 필요합니다. salary_history(emp_id, amount, effective_from, effective_to) 구조로 설계해야 특정 시점의 급여를 조회할 수 있습니다. HR·회계 도메인에서 가장 흔한 실수입니다.'},
  {mod:'m1',domain:'ERP 회계',
   q:'결재 상태를 status VARCHAR 컬럼 하나로 관리하고 있다. 감사팀에서 "이 전표가 언제, 누구에 의해 승인되었나요?"라고 물었을 때 답할 수 없는 이유는?',
   choices:['VARCHAR 타입은 날짜를 저장할 수 없기 때문이다','상태 값만 저장하고 변경 시각·변경자 이력을 기록하지 않았기 때문이다','status 컬럼에 인덱스가 없기 때문이다','조회 권한이 없기 때문이다'],
   answer:1,
   fb:'단순 status 컬럼은 현재 상태만 알 수 있습니다. 감사(Audit Trail)를 위해서는 status_log(id, doc_id, status, changed_at, changed_by) 테이블을 별도로 두어야 합니다.'},
  {mod:'m1',domain:'ERP 구매',
   q:'부서코드를 IF문에 직접 하드코딩했다. 조직 개편 후 발생하는 문제로 가장 적절한 것은?',
   code:"if dept_code == 'SALES_01':\n    apply_discount()\nelif dept_code == 'MKT_01':\n    apply_budget_limit()",
   choices:['코드 실행 속도가 느려진다','부서코드가 바뀔 때마다 코드를 직접 수정하고 배포해야 한다','데이터베이스 연결이 끊어진다','메모리 누수가 발생한다'],
   answer:1,

];

let queue=[],idx=0,answers=[],userAnswers=[];

function buildIntro(){
  document.getElementById('intro-module-list').innerHTML=MODULES.map(m=>{
    const cnt=Q.filter(q=>q.mod===m.id).length;
    return `<div class="mod-card" onclick="startModule('${m.id}')">
      <div class="mod-num">${m.num}</div>
      <div class="mod-info"><div class="mod-name">${m.name}</div><div class="mod-desc">${m.desc}</div></div>
      <div class="mod-count">${cnt}문제 &rsaquo;</div>
    </div>`;
  }).join('');

  document.getElementById('module-nav').innerHTML=
    MODULES.map(m=>`<button class="mod-btn" onclick="startModule('${m.id}')">${m.num} ${m.name.split('—')[0].trim().split('·')[0].trim()}</button>`).join('')+
    `<button class="mod-btn" onclick="goIntro()">&#8962; 홈</button>`;
}

function startAll(){queue=[...Q];go();}
function startModule(id){queue=Q.filter(q=>q.mod===id);go();}

function go(){
  idx=0;answers=[];userAnswers=[];
  show('quiz');
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('module-nav').style.display='flex';
  render();
}

function render(){
  const q=queue[idx],total=queue.length;
  document.getElementById('progress-bar').style.width=(idx/total*100)+'%';
  document.getElementById('q-domain').textContent=q.domain;
  const m=MODULES.find(x=>x.id===q.mod);
  document.getElementById('q-module-tag').textContent='MODULE '+m.num+'  ·  '+m.name;
  document.getElementById('q-number').textContent='문제 '+(idx+1)+' / '+total;
  document.getElementById('q-text').textContent=q.q;
  const ce=document.getElementById('q-code');
  if(q.code){ce.textContent=q.code;ce.style.display='block';}
  else ce.style.display='none';
  const keys=['A','B','C','D'];
  document.getElementById('choices').innerHTML=q.choices.map((c,i)=>
    `<button class="choice" onclick="sel(${i})" id="ch${i}">
      <div class="choice-key">${keys[i]}</div>
      <div class="choice-text">${c}</div>
    </button>`
  ).join('');
  const fb=document.getElementById('feedback');
  fb.className='feedback';fb.textContent='';
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-next').style.display='none';
  window._s=null;
}

function sel(i){
  if(document.getElementById('btn-next').style.display!=='none')return;
  document.querySelectorAll('.choice').forEach(el=>el.classList.remove('selected'));
  document.getElementById('ch'+i).classList.add('selected');
  window._s=i;
  document.getElementById('btn-submit').disabled=false;
}

function submit(){
  if(window._s===null)return;
  const q=queue[idx],ok=window._s===q.answer;
  answers.push(ok);userAnswers.push(window._s);
  document.querySelectorAll('.choice').forEach((el,i)=>{
    if(i===q.answer)el.classList.add('correct');
    else if(i===window._s&&!ok)el.classList.add('wrong');
    el.onclick=null;
  });
  const fb=document.getElementById('feedback');
  fb.textContent=(ok?'정답입니다!  ':'오답입니다.  ')+q.fb;
  fb.className='feedback show '+(ok?'correct':'wrong');
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-next').style.display='flex';
}

function next(){
  idx++;
  if(idx>=queue.length)result();
  else render();
}

function result(){
  document.getElementById('progress-bar').style.width='100%';
  const cor=answers.filter(Boolean).length,tot=answers.length;
  const pct=Math.round(cor/tot*100);
  setTimeout(()=>{document.getElementById('score-arc').style.strokeDashoffset=232.5-(pct/100*232.5);},100);
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('stat-correct').textContent=cor;
  document.getElementById('stat-wrong').textContent=tot-cor;
  document.getElementById('stat-total').textContent=tot;
  const titles=['다시 한번 도전해보세요!','조금 더 연습이 필요합니다','좋은 출발점입니다!','훌륭합니다!','완벽합니다!'];
  const subs=['틀린 문제를 복습하고 다시 도전해보세요.','핵심 개념을 다시 확인해보세요.','오답을 복습하면 빠르게 성장할 수 있습니다.','대부분의 함정을 이해하고 있습니다.','모든 함정을 완벽하게 이해했습니다!'];
  const tier=pct<40?0:pct<60?1:pct<75?2:pct<90?3:4;
  document.getElementById('result-title').textContent=titles[tier];
  document.getElementById('result-sub').textContent=subs[tier];
  document.getElementById('btn-retry-wrong').style.display=answers.some(a=>!a)?'inline-flex':'none';
  const keys=['A','B','C','D'];
  document.getElementById('review-list').innerHTML=queue.map((q,i)=>{
    const ok=answers[i];
    const qt=q.q.length>68?q.q.slice(0,68)+'…':q.q;
    return `<div class="review-item ${ok?'r-correct':'r-wrong'}">
      <div class="review-q" style="color:${ok?'#2e7d32':'#c62828'}">
        ${ok?'✓':'✗'} Q${i+1}. ${qt}
      </div>
      <div class="review-a">${!ok?`내 답변: ${keys[userAnswers[i]]}. ${q.choices[userAnswers[i]].slice(0,38)}…  &nbsp;|&nbsp;  `:''}정답: ${keys[q.answer]}. ${q.choices[q.answer].slice(0,38)}…</div>
    </div>`;
  }).join('');
  show('result');
}

function retryWrong(){
  queue=answers.map((a,i)=>a?null:queue[i]).filter(Boolean);
  idx=0;answers=[];userAnswers=[];
  show('quiz');render();
}

function goIntro(){
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('module-nav').style.display='none';
  show('intro');
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

buildIntro();
</script>
